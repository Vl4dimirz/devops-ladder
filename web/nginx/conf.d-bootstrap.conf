# ค่าตั้งต้นสำหรับ "ก่อน" มีใบรับรอง — ใช้ครั้งเดียวตอนขอใบแรก
# ⛔ ปัญหาไก่กับไข่: nginx เปิดพอร์ต 443 ไม่ได้ถ้ายังไม่มีใบรับรอง
#    แต่จะได้ใบรับรองต้องมี nginx ตอบพอร์ต 80 ก่อน
#    จึงต้องเริ่มด้วยค่าที่มีแต่ HTTP แล้วค่อยสลับเป็นค่าเต็มทีหลัง
server {
    listen 80;
    server_name demo.inksverse.com;

    # เส้นทางที่ Let's Encrypt จะมาอ่านไฟล์ยืนยันว่าเราคุมโดเมนนี้จริง
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
