# ค่าเต็มหลังมีใบรับรองแล้ว
# ⭐ พอร์ต 80 ยังต้องเปิดไว้เพื่อสองอย่างเท่านั้น
#    1. ให้ Let's Encrypt มาตรวจตอนต่ออายุ
#    2. เด้งคนที่พิมพ์ http:// ไป https://
server {
    listen 80;
    server_name demo.inksverse.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.inksverse.com;

    ssl_certificate     /etc/letsencrypt/live/demo.inksverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.inksverse.com/privkey.pem;

    # ⛔ ปิด TLS รุ่นเก่าทั้งหมด เหลือแค่ 1.2 กับ 1.3
    #    1.0 กับ 1.1 ถูกประกาศเลิกใช้ตั้งแต่ 2021 และยังเป็นข้อที่ตัวสแกนฟ้อง
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ⭐ HSTS บอกเบราว์เซอร์ว่า "ห้ามต่อเว็บนี้ด้วย http อีกเลย"
    #    ⚠️ ตั้งแล้วถอนยาก เบราว์เซอร์จำไว้นานตามเวลาที่ระบุ
    #       เริ่มด้วยเวลาสั้นก่อนเสมอ ถ้ามั่นใจแล้วค่อยเพิ่ม
    add_header Strict-Transport-Security "max-age=604800" always;

    # ส่วนหัวที่ตัวสแกนความปลอดภัยตรวจเป็นมาตรฐาน
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # ⚠️ CSP ที่แน่นเกินจะทำให้หน้าเว็บพัง ตัวนี้ตั้งไว้หลวมพอสำหรับหน้าเปล่า
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # ⛔ ซ่อนเลขรุ่นของ nginx ไม่ใช่ช่องโหว่ แต่เป็นข้อมูลที่ให้ฟรีโดยไม่จำเป็น
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
